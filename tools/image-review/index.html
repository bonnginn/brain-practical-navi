<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画像に線を描いて確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#172536;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:16px}h1{font-size:1.4rem;margin:0 0 8px}p{margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}button,.file{font:inherit;min-height:44px;padding:8px 14px;background:white;color:#172536;border:1px solid #8494a6;border-radius:7px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#115da1;color:white;border-color:#115da1}label{display:inline-flex;align-items:center;gap:6px}input,textarea,select{font:inherit}input[type=color]{width:44px;height:40px}textarea{display:block;width:100%;min-height:65px;padding:8px;border:1px solid #8494a6;border-radius:6px}.legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px;background:white;border-radius:6px}.swatch{display:inline-block;width:15px;height:15px;border:1px solid #555;margin-right:5px;vertical-align:middle}.viewport{overflow:auto;max-height:68vh;background:#d6dde5;border:1px solid #8494a6;padding:8px}canvas{display:block;width:100%;height:auto;touch-action:none;background:white;cursor:crosshair}#status{min-height:26px;overflow-wrap:anywhere}small{font-size:14px}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #d48d00;outline-offset:2px}#file{max-width:100%}@media(max-width:600px){main{padding:10px}.viewport{max-height:60vh}.toolbar{gap:6px}button{padding:8px 10px}}
</style>
<main><h1>画像に線を描いて確認</h1><p id="instruction">画像を読み込み中…</p>
<div class="legend" id="legend"><span><i class="swatch" style="background:#a0b4ff"></i>青紫：視床</span><span><i class="swatch" style="background:#50ffff"></i>水色：赤核</span><span><i class="swatch" style="background:#fa962d"></i>橙：黒質</span><span><i class="swatch" style="background:#dc64ff"></i>紫：視床下核</span><span><i class="swatch" style="background:#ff4b4b"></i>赤の輪郭：現在の脳幹</span></div>
<div class="toolbar"><label>線の色<input id="color" type="color" value="#00a344"></label><label>太さ<select id="width"><option value="2">細い</option><option value="4" selected>標準</option><option value="7">太い</option></select></label><button id="undo" disabled>一つ戻す</button><button id="clear" disabled>線をすべて消す</button><label>表示倍率<select id="zoom"><option value="1">画面に合わせる</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="save" class="primary" disabled>確認を保存</button><button id="download" disabled>PNGをダウンロード</button></div>
<div class="viewport"><canvas id="canvas" aria-label="確認画像。マウス・ペン・指で境界の目安を描けます"></canvas></div>
<p><label for="note">補足（任意）</label><textarea id="note" maxlength="4000" placeholder="線の意味や、判断しづらいところなど"></textarea></p>
<p id="status" role="status" aria-live="polite"></p>
<details><summary>次回、別の画像で使う</summary><p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="reference">中脳の確認図に戻す</button></p><small>選んだ画像はこのブラウザで開きます。「確認を保存」を押すと元画像・線の座標・注記付きPNGがこのPCの作業フォルダーに保存されます。外部へ送信せず、教材ラベルを自動変更しません。画像切替時は未保存の線・メモを破棄するか確認します。</small></details>
<p><small>保存された線は境界の目安です。専門家承認や、全断面への修正適用を意味しません。画面を閉じる前に保存してください。</small></p></main>
<script type="module" src="/review.js"></script></html>
