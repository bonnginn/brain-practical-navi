name: Deploy public alpha to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build for GitHub Pages
        run: npm run build
        env:
          DEPLOY_GITHUB_PAGES: "true"
          VITE_SOURCE_REPOSITORY_URL: https://github.com/bonnginn/brain-practical-navi
      - name: Audit GitHub Pages rights and notices distribution
        run: node scripts/audit_public_rights_notices.mjs --mode dist --root . --dist-root dist --expected-base /brain-practical-navi/ --expected-source-url https://github.com/bonnginn/brain-practical-navi --output work/public-rights-notices-dist-pages-ci.json
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
